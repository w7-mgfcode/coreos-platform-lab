# /etc/corelab/snippet-writer.conf — installed by the `prepare` action (root-owned, 0644).
# @SNIPPET_DIR@ is replaced with <PVE_LAB_STORAGE_PATH>/snippets at install time.
dir = @SNIPPET_DIR@
max_bytes = 262144
# The snippet directory is root-owned (root:corelab-snip, 2770); refuse it if that ever changes.
expected_dir_uid = 0
